services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peoplepulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # optional: connect with any SQL client on localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peoplepulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATA_PATH: /data/employee_attrition.csv
      RELOAD_ON_START: ${RELOAD_ON_START:-true}
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
